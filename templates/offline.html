<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - HoneyChain Traceability</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; text-align: center;">

  <div class="glass-card" style="max-width: 480px; width: 100%; padding: 2.5rem 1.5rem;">
    <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;">
      <i class="fa-solid fa-wifi" style="font-size: 2rem; color: #fbbf24; opacity: 0.7;"></i>
    </div>

    <h1 style="font-size: 1.6rem; color: #fff; margin-bottom: 0.5rem;">Network Connection Needed</h1>
    
    <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1.5rem;">
      HoneyChain verifies immutable cryptographic SHA-256 blocks and digital laboratory signatures live from the distributed consortium ledger.
    </p>

    <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--radius-sm); padding: 0.85rem; font-size: 0.8rem; color: #94a3b8; margin-bottom: 1.75rem;">
      <i class="fa-solid fa-shield-halved text-emerald"></i> To prevent tampering, authenticity verification is never performed offline.
    </div>

    <button onclick="window.location.reload()" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
      <i class="fa-solid fa-rotate-right"></i> Check Connection & Retry
    </button>
  </div>

</body>
</html>
